  <text x="150" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#F4F1FB">“The capacity to learn is a gift; the ability to learn is a</text><text x="150" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#F4F1FB">skill; the willingness to learn is a choice.”</text>
